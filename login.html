<script>
   // Relaie ?next=... vers les champs cachés des formulaires, pour
   // ramener l'utilisateur à sa réservation en cours après connexion.
   // Relaie aussi les messages d'erreur/succès renvoyés par auth.php.
   (function () {
       var params = new URLSearchParams(window.location.search);
       var next = params.get("next") || "";
       document.getElementById("login-next").value = next;
       document.getElementById("register-next").value = next;

       var messages = {
           invalidcredentials: "Identifiants incorrects. Veuillez réessayer.",
           emptyfields: "Merci de remplir tous les champs.",
           invalidemail: "Adresse email invalide.",
           emailexists: "Un compte existe déjà avec cet email.",
           passwordtooshort: "Le mot de passe doit contenir au moins 6 caractères.",
           registerfailed: "L'inscription a échoué. Veuillez réessayer.",
           loginrequired: "Merci de vous connecter pour réserver un véhicule.",
           accountcreated: "Compte créé avec succès ! Vous pouvez vous connecter."
       };
       var box = document.getElementById("form-alert");
       if (params.get("error") && messages[params.get("error")]) {
           box.textContent = messages[params.get("error")];
           box.classList.add("hc-alert-error");
           box.style.display = "block";
       } else if (params.get("success") && messages[params.get("success")]) {
           box.textContent = messages[params.get("success")];
           box.classList.add("hc-alert-success");
           box.style.display = "block";
       }
   })();

   function myMenuFunction() {
    var i = document.getElementById("navMenu");
    if(i.className === "nav-menu") {
        i.className += " responsive";
    } else {
        i.className = "nav-menu";
    }
   }
 
</script>
<script>
    var a = document.getElementById("loginBtn");
    var b = document.getElementById("registerBtn");
    var x = document.getElementById("login");
    var y = document.getElementById("register");
    function login() {
        x.style.left = "4px";
        y.style.right = "-520px";
        if (a) a.className += " white-btn";
        if (b) b.className = "btn";
        x.style.opacity = 1;
        y.style.opacity = 0;
    }
    function register() {
        x.style.left = "-510px";
        y.style.right = "5px";
        if (a) a.className = "btn";
        if (b) b.className += " white-btn";
        x.style.opacity = 0;
        y.style.opacity = 1;
    }
</script>
